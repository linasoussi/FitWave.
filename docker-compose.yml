version: '3.8'

services:
  web:
    build: .
    container_name: fitwave_web
    ports:
      - "8080:80"
    restart: unless-stopped

  logs:
    image: httpd:alpine
    container_name: fitwave_logs
    ports:
      - "8081:80"
    volumes:
      - ./logs:/usr/local/apache2/htdocs/
    restart: unless-stopped